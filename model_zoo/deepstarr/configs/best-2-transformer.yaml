# DeepSTARR Dataset - Best Trial Transformer Architecture Configuration V2
# Based on hyperparameter tuning results with optimal parameters (Trial f1591_00077)

dataset:
  name: deepstarr
  sequence_length: 249
  num_classes: 4
  signal_dim: 2

# Hardware configuration - optimized for 1 GPU
ngpus: 1
nnodes: 1
ncpus: 2
tokens: 4

# Training configuration - optimized parameters
training:
  batch_size: 128  # Optimized for single GPU
  accum: 1
  max_epochs: 500  # Reduced for 2-day training window
  checkpoint_every_n_epochs: 10
  log_freq: 100
  val_every_n_epochs: 1
  weight: standard
  snapshot_sampling: true
  ema: 0.9999

# Data configuration
data:
  train: deepstarr
  valid: deepstarr
  cache_dir: data

# Graph configuration
graph:
  type: uniform
  file: data
  report_all: false

# Noise configuration - optimized from tuning
noise:
  type: geometric
  sigma_min: 0.000528538
  sigma_max: 18.769085708720336  # Optimized value from tuning

# Sampling configuration
sampling:
  predictor: euler
  steps: 128
  noise_removal: true

# Evaluation configuration
eval:
  batch_size: 128
  perplexity: false
  perplexity_batch_size: 32
  use_evoaug_oracle: false

# SP-MSE validation configuration - enabled for full training
sp_mse_validation:
  enabled: false
  validation_freq_epochs: 5
  validation_samples: 500
  oracle_path: "model_zoo/deepstarr/oracle_models/oracle_models/oracle_DeepSTARR_DeepSTARR_data.ckpt"
  data_path: "model_zoo/deepstarr/data_files/full-0-new.h5"
  sampling_steps: 10
  early_stopping_patience: null  # Disabled for full training run

# Optimization configuration - optimized from tuning
optim:
  weight_decay: 0.06685510162938978  # Optimized value from tuning
  optimizer: AdamW
  lr: 0.00017725334799565962  # Optimized value from tuning
  beta1: 0.9230867475203643  # Optimized value from tuning
  beta2: 0.9928957052252827  # Optimized value from tuning
  eps: 2.303913302543587e-08  # Optimized value from tuning
  warmup: 2500
  grad_clip: 1.0

# Model configuration - optimized from tuning
model:
  name: small
  type: ddit
  architecture: transformer
  hidden_size: 1024  # Optimized value from tuning (larger model)
  cond_dim: 128
  length: 249
  n_blocks: 6  # Reduced for faster training
  n_heads: 8  # Optimized value from tuning
  scale_by_sigma: false
  dropout: 0.16116809739350887  # Optimized value from tuning
  class_dropout_prob: 0.1

# Logging configuration
wandb:
  enabled: true
  project: d3-HP-2
  name: best-2-tran-full-deepstarr
  entity: d3-cshl
  tags: ["best_hp"]

# Paths - using the full data file path
paths:
  data_file: "model_zoo/deepstarr/data_files/full-0-new.h5"
  oracle_model: "model_zoo/deepstarr/oracle_models/oracle_models/oracle_DeepSTARR_DeepSTARR_data.ckpt"
  checkpoints_dir: "checkpoints" 