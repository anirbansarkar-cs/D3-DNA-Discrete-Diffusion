    - seaborn==0.13.2
    - pillow==10.2.0

    # ============================================
    # Tensor operations
    # ============================================
    - einops==0.7.0
    - fancy-einsum==0.0.3

    # ============================================
    # Configuration
    # ============================================
    - omegaconf==2.3.0

    # ============================================
