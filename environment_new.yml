# Conda environment for D3-DNA-Discrete-Diffusion (env name: d3-new).
#
# Two-step install (see also setup_new.sh / post_install.sh):
#   conda env create -f environment_new.yml -n d3-new
#   conda activate d3-new
#   bash post_install.sh
#
# post_install.sh handles the things a conda yml cannot express:
#   - torch wheels from the cu121 index URL
#   - flash-attn install with --no-build-isolation
#   - editable install of this repo (pip install -e .)
#
# CUDA: torch 2.5.1 ships its own CUDA 12.1 runtime in the pip wheel, and
# flash-attn 2.7.4.post1 ships a matching prebuilt wheel. No system or
# conda CUDA toolkit is required for a normal Linux install.

name: d3-new
channels:
  - defaults
dependencies:
  - _libgcc_mutex=0.1=main
  - _openmp_mutex=5.1=1_gnu
  - ca-certificates=2023.12.12=h06a4308_0
  - ld_impl_linux-64=2.38=h1181459_1
  - libffi=3.4.4=h6a678d5_0
  - libgcc-ng=11.2.0=h1234567_1
  - libgomp=11.2.0=h1234567_1
  - libstdcxx-ng=11.2.0=h1234567_1
  - ncurses=6.4=h6a678d5_0
  - openssl=3.0.13=h7f8727e_0
  - pip=23.3.1=py39h06a4308_0
  - python=3.9.18=h955ad1f_0
  - readline=8.2=h5eee18b_0
  - setuptools=68.2.2=py39h06a4308_0
  - sqlite=3.41.2=h5eee18b_0
  - tk=8.6.12=h1ccaba5_0
  - wheel=0.41.2=py39h06a4308_0
  - xz=5.4.6=h5eee18b_0
  - zlib=1.2.13=h5eee18b_0
  - pip:
    # NOTE: torch, torchvision, torchaudio, triton, and flash-attn are
    # installed by post_install.sh (they require --index-url / --no-build-isolation
    # which conda env yml cannot express). Listed here as comments for visibility:
    #   torch==2.5.1                (from https://download.pytorch.org/whl/cu121)
    #   torchvision==0.20.1         (from https://download.pytorch.org/whl/cu121)
    #   torchaudio==2.5.1           (from https://download.pytorch.org/whl/cu121)
    #   triton==3.1.0               (transitive of torch)
    #   flash-attn==2.7.4.post1     (wheel from flash-attention GitHub release)

    # ============================================
    # Lightning / training utilities
    # ============================================
    - pytorch-lightning==2.1.0
    - lightning-utilities==0.15.2
    - torchmetrics==1.8.2

    # ============================================
    # Data handling and scientific computing
    # ============================================
    - pandas==2.2.1
    - numpy==1.24.1
    - scipy==1.13.1
